<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Markdown Editor</title>
    <!-- 使用 CDN 加载 Vditor -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.7/dist/index.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #1e293b;
            overflow: auto;
        }

        #vditor {
            width: 100%;
            height: 100%;
        }

        /* 自定义 Vditor 深色主题 */
        .vditor {
            --panel-background-color: #1e293b !important;
            --textarea-background-color: #1e293b !important;
            border: none !important;
            border-radius: 0 !important;
            background: #1e293b !important;
        }

        .vditor-content {
            background: #1e293b !important;
        }

        .vditor-ir {
            background: #1e293b !important;
        }

        .vditor-ir .vditor-reset {
            background: #1e293b !important;
            color: #f1f5f9 !important;
        }

        .vditor-reset {
            background: #1e293b !important;
            font-size: 16px !important;
            line-height: 1.6 !important;
            padding: 16px !important;
            color: #f1f5f9 !important;
        }

        .vditor-toolbar {
            display: none !important;
        }

        /* 图片样式 */
        .vditor-ir img {
            max-width: 100% !important;
            border-radius: 8px !important;
            margin: 8px 0 !important;
        }

        /* 隐藏滚动条但保持可滚动 */
        .vditor-reset::-webkit-scrollbar {
            display: none;
        }

        /* 隐藏占位符 */
        .vditor [data-placeholder]::before {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="vditor"></div>
    <!-- 使用 CDN 加载 Vditor JS -->
    <script src="https://cdn.jsdelivr.net/npm/vditor@3.10.7/dist/index.min.js"></script>
    <script>
        let vditor;

        // 初始化 Vditor
        function initVditor() {
            vditor = new Vditor('vditor', {
                theme: 'dark',
                mode: 'ir',
                toolbar: [],
                placeholder: '',
                cache: {
                    enable: false
                },
                preview: {
                    theme: {
                        current: 'dark'
                    }
                },
                after: () => {
                    // 通知 Swift 编辑器已准备好
                    window.webkit?.messageHandlers?.editorReady?.postMessage('ready');
                    // 自动聚焦，弹出键盘（延迟更长以确保视图完全加载）
                    setTimeout(() => {
                        vditor.focus();
                        // 真机上可能需要模拟点击来触发键盘
                        const editorElement = document.querySelector('.vditor-ir .vditor-reset');
                        if (editorElement) {
                            editorElement.click();
                            editorElement.focus();
                        }
                    }, 500);
                },
                input: (value) => {
                    // 内容变化时通知 Swift
                    window.webkit?.messageHandlers?.contentChanged?.postMessage(value);
                }
            });
        }

        // 供 Swift 调用：设置内容
        function setContent(content) {
            if (vditor) {
                vditor.setValue(content);
            }
        }

        // 供 Swift 调用：获取内容
        function getContent() {
            return vditor ? vditor.getValue() : '';
        }

        // 供 Swift 调用：插入内容
        function insertValue(content) {
            if (vditor) {
                vditor.insertValue(content);
            }
        }

        // 供 Swift 调用：在光标处插入图片
        function insertImage(url, alt) {
            if (vditor) {
                // 获取当前内容
                const currentContent = vditor.getValue();
                const markdown = `![${alt || 'image'}](${url})`;

                // 追加图片到内容末尾
                let newContent;
                if (currentContent.trim() === '') {
                    newContent = markdown + '\n\n';
                } else if (currentContent.endsWith('\n')) {
                    newContent = currentContent + markdown + '\n\n';
                } else {
                    newContent = currentContent + '\n' + markdown + '\n\n';
                }

                // 设置新内容
                vditor.setValue(newContent);

                // 手动通知 Swift 内容已更新（setValue 不会触发 input 回调）
                window.webkit?.messageHandlers?.contentChanged?.postMessage(newContent);

                // 延迟后将光标移到末尾
                setTimeout(() => {
                    vditor.focus();
                    // 滚动到底部
                    const editorElement = document.querySelector('.vditor-ir .vditor-reset');
                    if (editorElement) {
                        editorElement.scrollTop = editorElement.scrollHeight;
                    }
                }, 300);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', initVditor);
    </script>
</body>

</html>
